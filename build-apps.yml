name: Build Ronyal Super Store

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare barcode scanner library
        shell: pwsh
        run: |
          npm install @zxing/browser@0.1.5
          $lib = Get-ChildItem node_modules/@zxing/browser -Recurse -File -Filter index.min.js | Select-Object -First 1
          if (-not $lib) { throw 'Could not find ZXing browser bundle.' }
          Copy-Item $lib.FullName zxing-browser.min.js -Force

      - name: Build Windows Installer
        run: npm run build:windows

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Ronyal-Super-Store-Windows
          path: dist/*.exe

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7 @zxing/browser@0.1.5

      - name: Prepare web files and barcode scanner
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          if [ -f sw.js ]; then cp sw.js www/; fi
          ZXING_FILE="$(find node_modules/@zxing/browser -type f -name 'index.min.js' | head -n 1)"
          test -n "$ZXING_FILE"
          cp "$ZXING_FILE" zxing-browser.min.js
          cp zxing-browser.min.js www/

      - name: Configure Capacitor and Android camera permission
        run: |
          echo '{"appId":"com.ronyal.superstore","appName":"Ronyal Super Store","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          sed -i '/<application/i\    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Ronyal-Super-Store-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
