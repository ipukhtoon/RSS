name: Ronyal POS Automated QA

on:
  workflow_dispatch:
  push:
    branches:
      - pos-automated-qa
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'qa/e2e/**'
      - '.github/workflows/pos-qa.yml'

permissions:
  contents: read

jobs:
  browser-qa:
    name: Playwright POS smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa/e2e/package.json

      - name: Install isolated QA dependencies
        working-directory: qa/e2e
        run: npm install

      - name: Install Chromium
        working-directory: qa/e2e
        run: npx playwright install --with-deps chromium

      - name: Run browser QA
        working-directory: qa/e2e
        run: npm test

      - name: Upload Playwright reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronyal-pos-qa-report
          path: |
            qa/e2e/playwright-report/
            qa/e2e/test-results/
          if-no-files-found: warn
          retention-days: 14
