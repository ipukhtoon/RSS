name: Build Ronyal Super Store

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer
        run: npm run build:windows

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Ronyal-Super-Store-Windows
          path: dist/*.exe

  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor dependencies
        run: |
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7 @capacitor/app@7
          npm install @capacitor-mlkit/barcode-scanning@7
          npm install --no-save esbuild
          npm uninstall @capgo/capacitor-printer || true

      - name: Prepare web assets and barcode bridge
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html || {
            echo "ERROR: index.html is missing from the repository root."
            exit 1
          }

          test -f manifest.json || {
            echo "ERROR: manifest.json is missing from the repository root."
            exit 1
          }

          test -f native/android/RonyalPrintPlugin.java || {
            echo "ERROR: Native print plugin source is missing."
            exit 1
          }

          mkdir -p www
          cp index.html www/index.html
          cp manifest.json www/manifest.json

          # Branding assets
          cp ronyal-logo.png www/ronyal-logo.png
          cp ronyal-logo-receipt.png www/ronyal-logo-receipt.png

          if [ -f sw.js ]; then
            cp sw.js www/sw.js
          fi

          cat > printer-bridge-entry.js <<'JS'
          import { registerPlugin } from '@capacitor/core';
          import { App } from '@capacitor/app';
          import {
            BarcodeScanner,
            BarcodeFormat
          } from '@capacitor-mlkit/barcode-scanning';

          const Native = registerPlugin('RonyalPrint');

          window.RonyalPrinter = {
            printWebView: (options = {}) =>
              Native.printWebView(options),
            getPrintStatus: () =>
              Native.getPrintStatus()
          };

          window.RonyalFiles = {
            saveFile: (options = {}) =>
              Native.saveFile(options),
            pickFile: (options = {}) =>
              Native.pickFile(options)
          };

          window.RonyalApp = {
            addListener: (eventName, callback) =>
              App.addListener(eventName, callback),
            exitApp: () => App.exitApp()
          };

          window.RonyalBarcodeScanner = {
            scanBarcode: async () => {
              const { barcodes } = await BarcodeScanner.scan({
                formats: [
                  BarcodeFormat.Ean13,
                  BarcodeFormat.Ean8,
                  BarcodeFormat.UpcA,
                  BarcodeFormat.UpcE,
                  BarcodeFormat.Code128,
                  BarcodeFormat.Code39,
                  BarcodeFormat.QrCode
                ]
              });

              return {
                barcode: barcodes?.[0]?.rawValue || ''
              };
            }
          };
          JS

          npx esbuild printer-bridge-entry.js \
            --bundle \
            --platform=browser \
            --format=iife \
            --outfile=printer-bridge.bundle.js

          python - <<'PY'
          from pathlib import Path
          import re

          html_path = Path("www/index.html")
          html = html_path.read_text(encoding="utf-8")
          bundle = Path("printer-bridge.bundle.js").read_text(encoding="utf-8")

          injection = (
              "<script>\n"
              + bundle
              + "\n</script>\n"
          )

          # Register native bridges before the HTML's own scripts execute.
          html, count = re.subn(
              r"</head\s*>",
              lambda match: injection + match.group(0),
              html,
              count=1,
              flags=re.IGNORECASE,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Could not find </head> in www/index.html"
              )

          html_path.write_text(html, encoding="utf-8")
          print("Native bridge injected into the document head.")
          PY

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.ronyal.superstore",
            "appName": "Ronyal Super Store",
            "webDir": "www",
            "android": {
              "allowMixedContent": true
            }
          }
          JSON

          npx cap add android

      # Branding addition: Generate Android launcher icons
      - name: Apply Ronyal Super Store launcher icon
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --user Pillow

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("ronyal-logo.png")
          if not source.is_file():
              raise SystemExit("ERROR: ronyal-logo.png is missing.")

          logo = Image.open(source).convert("RGBA")

          densities = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          res_dir = Path("android/app/src/main/res")

          for density, size in densities.items():
              folder = res_dir / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              icon = logo.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          # Remove adaptive icon XML overrides so Android uses
          # the newly generated branded launcher PNG files.
          adaptive_dir = res_dir / "mipmap-anydpi-v26"

          if adaptive_dir.exists():
              for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  file = adaptive_dir / name
                  if file.exists():
                      file.unlink()

          print("Ronyal Super Store launcher icons generated.")
          PY

      - name: Install native print and file picker plugin
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(find android/app/src/main/java \
            -name MainActivity.java -print -quit)"

          test -n "$MAIN_ACTIVITY" || {
            echo "ERROR: Could not locate MainActivity.java"
            exit 1
          }

          PACKAGE="$(sed -n \
            's/^package[[:space:]]\+\([^;]*\);.*/\1/p' \
            "$MAIN_ACTIVITY" | head -n 1)"

          test -n "$PACKAGE" || {
            echo "ERROR: Could not read the Android package name"
            exit 1
          }

          JAVA_DIR="$(dirname "$MAIN_ACTIVITY")"

          sed "s/^package PACKAGE_NAME_PLACEHOLDER;/package $PACKAGE;/" \
            native/android/RonyalPrintPlugin.java \
            > "$JAVA_DIR/RonyalPrintPlugin.java"

          cat > "$MAIN_ACTIVITY" <<JAVA
          package $PACKAGE;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(RonyalPrintPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i \
              's/<application/<uses-permission android:name="android.permission.CAMERA"\/>\n    <application/' \
              "$MANIFEST"
          fi

          grep -q 'window.RonyalApp' www/index.html
          grep -q 'window.RonyalBarcodeScanner' www/index.html
          grep -q 'window.RonyalPrinter' www/index.html
          grep -q 'window.RonyalFiles' www/index.html

          test -s "$JAVA_DIR/RonyalPrintPlugin.java"

          echo "Native plugins configured."

      - name: Sync Capacitor and build APK
        run: |
          set -euo pipefail

          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Ronyal-Super-Store-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
