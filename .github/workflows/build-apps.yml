name: Build Ronyal Super Store

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer
        run: npm run build:windows

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Ronyal-Super-Store-Windows
          path: dist/*.exe

  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor dependencies
        run: |
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
          npm install @capacitor-mlkit/barcode-scanning@7
          npm install --no-save esbuild
          npm uninstall @capgo/capacitor-printer || true

      - name: Prepare Android web assets
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f manifest.json
          test -f native/android/RonyalPrintPlugin.java

          mkdir -p www

          cp index.html www/index.html
          cp manifest.json www/manifest.json

          if [ -f sw.js ]; then
            cp sw.js www/sw.js
          fi

          cat > printer-bridge-entry.js <<'JS'
          import { registerPlugin } from '@capacitor/core';

          const Native = registerPlugin('RonyalPrint');

          window.RonyalPrinter = {
            printWebView: (options = {}) =>
              Native.printWebView(options),

            getPrintStatus: () =>
              Native.getPrintStatus()
          };

          window.RonyalFiles = {
            saveFile: (options = {}) =>
              Native.saveFile(options),

            pickFile: (options = {}) =>
              Native.pickFile(options)
          };
          JS

          npx esbuild printer-bridge-entry.js \
            --bundle \
            --platform=browser \
            --format=iife \
            --outfile=printer-bridge.bundle.js

          python - <<'PY'
          from pathlib import Path
          import re

          html_path = Path("www/index.html")
          html = html_path.read_text(encoding="utf-8")
          bridge = Path("printer-bridge.bundle.js").read_text(encoding="utf-8")

          if "window.RonyalFiles" not in html:
              raise SystemExit(
                  "The HTML does not contain the Android file bridge. "
                  "Use the updated POS HTML."
              )

          if "window.RonyalPrinter" not in html:
              raise SystemExit(
                  "The HTML does not contain the Android printer bridge."
              )

          html, count = re.subn(
              r"</body\s*>",
              lambda match: (
                  "<script>\n"
                  + bridge
                  + "\n</script>\n"
                  + match.group(0)
              ),
              html,
              count=1,
              flags=re.IGNORECASE
          )

          if count != 1:
              raise SystemExit("Could not inject the native Android bridge.")

          html_path.write_text(html, encoding="utf-8")
          PY

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.ronyal.superstore",
            "appName": "Ronyal Super Store",
            "webDir": "www",
            "android": {
              "allowMixedContent": true
            }
          }
          JSON

          npx cap add android

      - name: Register native Android plugin
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(find android/app/src/main/java \
            -name MainActivity.java -print -quit)"

          test -n "$MAIN_ACTIVITY" || {
            echo "MainActivity.java was not found."
            exit 1
          }

          PACKAGE="$(sed -n \
            's/^package[[:space:]]\+\([^;]*\);.*/\1/p' \
            "$MAIN_ACTIVITY" | head -n 1)"

          test -n "$PACKAGE" || {
            echo "Could not determine the Android package."
            exit 1
          }

          JAVA_DIR="$(dirname "$MAIN_ACTIVITY")"

          sed "s/^package PACKAGE_NAME_PLACEHOLDER;/package $PACKAGE;/" \
            native/android/RonyalPrintPlugin.java \
            > "$JAVA_DIR/RonyalPrintPlugin.java"

          cat > "$MAIN_ACTIVITY" <<JAVA
          package $PACKAGE;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(RonyalPrintPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

          grep -q 'RonyalPrintPlugin' "$MAIN_ACTIVITY"
          test -s "$JAVA_DIR/RonyalPrintPlugin.java"

      - name: Sync Capacitor and build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Ronyal-Super-Store-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
