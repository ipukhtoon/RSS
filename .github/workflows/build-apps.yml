name: Build Ronyal Super Store

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer
        run: npm run build:windows

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Ronyal-Super-Store-Windows
          path: dist/*.exe

  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
          npm install @capacitor-mlkit/barcode-scanning@7
          npm install @capgo/capacitor-printer@7
          npm install --no-save esbuild

      - name: Prepare Web Files and Embed Printer Bridge
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          if [ -f sw.js ]; then cp sw.js www/; fi

          cat > printer-bridge-entry.js <<'EOF'
          import { Printer } from '@capgo/capacitor-printer';

          window.RonyalPrinter = {
            printWebView: (options = {}) => Printer.printWebView(options)
          };
          EOF

          npx esbuild printer-bridge-entry.js \
            --bundle \
            --platform=browser \
            --format=iife \
            --outfile=printer-bridge.bundle.js

          python - <<'PY'
          from pathlib import Path

          p = Path('www/index.html')
          s = p.read_text()
          bundle = Path('printer-bridge.bundle.js').read_text()

          marker = "<script>\n(()=>{'use strict';"

          if marker not in s:
              raise SystemExit(
                  'Could not find main app script marker in index.html'
              )

          replacement = (
              '<script>\n'
              + bundle
              + '\n</script>\n<script>\n(()=>{\'use strict\';'
          )

          p.write_text(s.replace(marker, replacement, 1))
          PY

      - name: Verify printer bridge was embedded
        run: |
          grep -q "window.RonyalPrinter" www/index.html
          grep -q "printWebView" www/index.html
          echo "Printer bridge found in Android web assets."

      - name: Configure Capacitor
        run: |
          echo '{"appId":"com.ronyal.superstore","appName":"Ronyal Super Store","webDir":"www","android":{"allowMixedContent":true}}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Configure Android Camera Permission
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Ronyal-Super-Store-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
