name: POS Playwright Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pos-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-audit:
    name: POS audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run existing integrity tests
        run: npm test
      - name: Run Playwright audit
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14