name: Build POS APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Wrapper App
        run: |
          npm init -y
          npm install pwa-builder-lib --save-dev || true
          # Create a basic Cordova/Capacitor metadata structure for clean export
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/

      - name: Archive Web Assets
        uses: actions/upload-artifact@v4
        with:
          name: ronyal-pos-web-package
          path: www/
          
