name: Build PWA APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Bubblewrap CLI Globally
        run: npm install -g @bubblewrap/cli

      - name: Initialize Bubblewrap Non-Interactively
        run: |
          bubblewrap init --manifest=https://ipukhtoon.github.io/RSS/manifest.json --directory=twa-project --skip-validation || true
          cd twa-project
          bubblewrap update --manifest=https://ipukhtoon.github.io/RSS/manifest.json || true

      - name: Build TWA APK Package
        run: |
          cd twa-project
          bubblewrap build --manifest=https://ipukhtoon.github.io/RSS/manifest.json || true

      - name: Find and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ronyal-pos-apk
          path: |
            twa-project/app/build/outputs/apk/release/*.apk
            twa-project/*.apk
            *.apk

            
